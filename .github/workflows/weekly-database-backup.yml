name: Weekly encrypted database and Storage backup
on:
  schedule:
    # Domingo 03:00 UTC = sábado 23:00 America/La_Paz.
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-production-backup
  cancel-in-progress: false
jobs:
  backup:
    # Remains disabled until the private provider and protected variables are reviewed.
    if: vars.BACKUP_ENABLED == 'true' && false
    environment: production-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          aws --version
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: DB, Storage, verify both, joint recovery marker, then retention
        run: node supabase/backup/weekly-backup.mjs
        env:
          # Review branch: hard stop even if repository variables are enabled.
          BACKUP_ENABLED: 'false'
          BACKUP_MODE: production
          BACKUP_PROJECT_REF: groyjvbtcuhjbltmmdfl
          PGHOST: ${{ secrets.BACKUP_PG_HOST }}
          PGPORT: ${{ secrets.BACKUP_PG_PORT }}
          PGDATABASE: postgres
          PGUSER: ${{ secrets.BACKUP_PG_USER }}
          PGPASSWORD: ${{ secrets.BACKUP_PG_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ADDRESSING_STYLE: ${{ vars.BACKUP_S3_ADDRESSING_STYLE }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          BACKUP_S3_STORAGE_PREFIX: ${{ vars.BACKUP_S3_STORAGE_PREFIX }}
          BACKUP_S3_WEEKLY_PREFIX: ${{ vars.BACKUP_S3_WEEKLY_PREFIX }}
          BACKUP_STORAGE_URL: ${{ vars.BACKUP_STORAGE_URL }}
          BACKUP_STORAGE_API_KEY: ${{ secrets.BACKUP_STORAGE_API_KEY }}
          BACKUP_STORAGE_READ_TOKEN: ${{ secrets.BACKUP_STORAGE_READ_TOKEN }}
          BACKUP_BUCKET_PRIVATE_CONFIRMED: ${{ vars.BACKUP_BUCKET_PRIVATE_CONFIRMED }}
          BACKUP_S3_VERSIONING: ${{ vars.BACKUP_S3_VERSIONING }}
          BACKUP_S3_POLICY_STATUS: ${{ vars.BACKUP_S3_POLICY_STATUS }}
          BACKUP_RETENTION_WEEKS: ${{ vars.BACKUP_RETENTION_WEEKS }}
          BACKUP_S3_SSE: ${{ vars.BACKUP_S3_SSE }}
          BACKUP_S3_KMS_KEY_ID: ${{ secrets.BACKUP_S3_KMS_KEY_ID }}
    # Dumps are never uploaded as GitHub artifacts or committed to this public repo.
